# Daily: if brandenleong1/utils moved, push the bump to the `bot/bump-utils` branch, and put a one-click "open a PR"
# link in the run summary. Anyone with write access opens the PR from there; it then goes through review and the
# PR bot like any other. The bot doesn't open PRs itself: that needs "Allow GitHub Actions to create and approve pull
# requests", which would also let a workflow approve PRs and stand in for the second person (docs/infra.md).
name: Update Submodules
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git submodule update --remote lib/utils
      - name: Push the bump branch
        env:
          BRANCH: bot/bump-utils
        run: |
          if git diff --quiet lib/utils; then
            echo "lib/utils is up to date" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SHA=$(git -C lib/utils rev-parse --short HEAD)
          TITLE="[UI] Fix: Bump Utils Submodule To \`$SHA\`"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add lib/utils
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1&title=$(jq -rn --arg t "$TITLE" '$t|@uri')"
          {
            echo "### lib/utils has updates"
            echo "Pushed \`$BRANCH\` with \`lib/utils\` at brandenleong1/utils@$SHA."
            echo "[Open the pull request]($URL). Fill in Context / Changes / Testing; review and the PR bot do the rest."
          } >> "$GITHUB_STEP_SUMMARY"
