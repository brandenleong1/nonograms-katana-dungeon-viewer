# Daily: if brandenleong1/utils moved, open (or update) a PR that bumps lib/utils. main is protected, so the bot
# can't push to it directly. PRs and pushes made with GITHUB_TOKEN don't trigger workflows, so this dispatches the
# pre-commit checks on the PR's branch itself, and reports `pr-policy` (its fixed title is the exception in
# tools/check-pr.mjs). The PR bot then reports `pr-bot`; a maintainer approves and squash-merges.
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: Update Submodules
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git submodule update --remote lib/utils
      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/bump-utils
        run: |
          if git diff --quiet lib/utils; then
            echo "lib/utils is up to date"
            exit 0
          fi
          SHA=$(git -C lib/utils rev-parse --short HEAD)
          TITLE="Auto-Bump [Utils] Submodule (-> $SHA)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add lib/utils
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --title "$TITLE"
          else
            gh pr create --head "$BRANCH" --base main --title "$TITLE" \
              --body "Bumps \`lib/utils\` to brandenleong1/utils@$SHA. Opened by the daily Update Submodules workflow."
          fi
          gh workflow run precommit.yml --ref "$BRANCH"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=success -f context=pr-policy \
            -f description="Submodule bump: fixed title" >/dev/null
