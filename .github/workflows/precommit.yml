# Pre-commit checks on every pull request, and on demand (the submodule bot dispatches it, since its PRs can't trigger
# workflows): syntax, unit tests (npm test), and integration (the browser smoke test). The `precommit` job is the one
# required status check (.github/rulesets/main.json), and the ruleset requires the branch to be up to date with main,
# so these run on what will land. Add new jobs to its `needs`. Keep that job's name `precommit`: the ruleset matches it.
name: Precommit
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every module
        run: git ls-files '*.js' '*.mjs' | xargs -n1 node --check

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  integration:
    name: Integration (browser smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (CI only; not a site dependency)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:smoke

  precommit:
    if: always()
    needs: [syntax, test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: All pre-commit jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
