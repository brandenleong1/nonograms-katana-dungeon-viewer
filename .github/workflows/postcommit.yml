# Post-commit checks on main: the commit message format, and the same unit and integration tests as precommit, on the
# merged commit. Also weekly (tests only), to catch drift in browsers, runners and the lib/utils submodule.
name: Postcommit
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-format:
    name: Commit message format
    if: github.event_name != 'schedule'   # push (an admin's manual merge) or dispatch (the PR bot, after its merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The merged commit follows docs/pr_guidelines.md (title, blank line, PR URL)
        run: git log -1 --format=%B | node tools/check-pr.mjs --commit

  test:
    name: Unit tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/run-tests.mjs

  smoke:
    name: Integration (browser smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright (CI only; not a site dependency)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - run: npm run test:smoke
